server:
  port: 8080

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB
  codec:
    multipart:
      max-parts: 20
      max-disk-usage-per-part: 10MB
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/devknowledge
    username: postgres
    password: 132639
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-on-validation-error: true
    clean-disabled: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

mybatis-plus:
  type-handlers-package: com.devknowledge.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

jwt:
  secret: dkYmFzZTY0U2VjcmV0S2V5Rm9yRGV2S25vd2xlZGdlQXBwbGljYXRpb24yMDI2
  access-token-expiration: 7200000    # 2 hours
  refresh-token-expiration: 604800000 # 7 days

wiki:
  vault:
    path: wiki_vault

kb:
  raw-file:
    storage-path: raw_files

observability:
  # request_traces / request_spans 保留天数，error_reports 与 user_feedback 永久保留
  trace-retention-days: 14

app:
  # 管理后台使用邮箱白名单鉴权，多个邮箱用逗号分隔
  admin:
    emails: ${DEVKNOWLEDGE_ADMIN_EMAILS:2573774516@qq.com}
  # 邮件 SMTP 配置通过环境变量提供，避免把凭据提交到仓库
  notifications:
    developer-email: ${DEVKNOWLEDGE_DEVELOPER_EMAIL:}

